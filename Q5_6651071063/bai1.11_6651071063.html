<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập</title>
<style>
    body {
        font-family: Arial, sans-serif;
    }
    .login-box {
        width: 320px;
        border: 1px solid #999;
        padding: 10px;
    }
    h2 {
        color: #a0522d;
        text-align: center;
        margin-top: 0;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    td {
        padding: 6px;
    }
    input[type="text"], input[type="password"] {
        width: 95%;
        box-sizing: border-box;
    }
    .btn-cell, .label-cell {
        background-color: #cde6f7;
    }
    #lblKetQua {
        color: blue;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="login-box">
    <h2>Đăng nhập</h2>
    <form id="frmDangNhap">
        <table>
            <tr>
                <td>Mã người dùng:</td>
                <td><input type="text" id="txtUser"></td>
            </tr>
            <tr>
                <td>Mật khẩu:</td>
                <td><input type="password" id="txtPass"></td>
            </tr>
            <tr>
                <td></td>
                <td class="btn-cell">
                    <input type="button" id="btnDongY" value="Đồng ý" onclick="hienThiTenDangNhap()">
                </td>
            </tr>
            <tr>
                <td></td>
                <td class="label-cell">
                    <div id="lblKetQua"></div>
                </td>
            </tr>
        </table>
    </form>
</div>

<script>
    function hienThiTenDangNhap() {
        var maNguoiDung = document.getElementById("txtUser").value;
        document.getElementById("lblKetQua").innerText = maNguoiDung;
    }
</script>

</body>
</html>
