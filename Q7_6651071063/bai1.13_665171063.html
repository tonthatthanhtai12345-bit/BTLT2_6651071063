<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng ký du lịch</title>
<style>
    body {
        font-family: Arial, sans-serif;
    }
    .register-box {
        width: 620px;
        border: 1px solid #999;
        padding: 10px;
        background-color: #fdf9d8;
    }
    h2 {
        color: #003399;
        text-align: center;
        margin-top: 0;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    td {
        padding: 6px;
        vertical-align: middle;
        border-bottom: 1px solid #e8e0a0;
    }
    .label-col {
        width: 180px;
    }
    input[type="text"] {
        width: 95%;
        box-sizing: border-box;
    }
    .btn-cell {
        text-align: center;
    }
    #lblThongBao {
        color: #cc6600;
        font-weight: bold;
        text-align: center;
        display: block;
    }
    fieldset#grpSoLuong {
        width: 350px;
        height: 55px;
        border: 1px solid #990000;
    }
    fieldset#grpSoLuong legend {
        color: #990000;
        font-style: italic;
    }
    fieldset#grpSoLuong input[type="text"] {
        width: 40px;
    }
    textarea#txtGhiChu {
        width: 300px;
    }
</style>
</head>
<body>

<div class="register-box">
    <h2>Đăng ký du lịch</h2>
    <form id="frmDangKyDuLich">
        <table>
            <tr>
                <td class="label-col">Họ và tên</td>
                <td><input type="text" id="txtHoTen" size="40"></td>
            </tr>
            <tr>
                <td>Địa chỉ</td>
                <td><input type="text" id="txtDiaChi" size="40"></td>
            </tr>
            <tr>
                <td>Điện thoại</td>
                <td><input type="text" id="txtDienThoai" size="40"></td>
            </tr>
            <tr>
                <td>Khách Việt Nam</td>
                <td><input type="checkbox" id="chkKhachVN" checked></td>
            </tr>
            <tr>
                <td>Chọn tour</td>
                <td>
                    <select id="cboTour">
                        <optgroup label="Miền Bắc">
                            <option value="Hà Nội - Hạ Long - Sapa">Hà Nội - Hạ Long - Sapa</option>
                            <option value="Hà Nội - Chùa Hương - Ninh Bình">Hà Nội - Chùa Hương - Ninh Bình</option>
                            <option value="Hà Nội - Cát Bà - Tuần Châu">Hà Nội - Cát Bà - Tuần Châu</option>
                        </optgroup>
                        <optgroup label="Miền Trung">
                            <option value="Huế - Bạch Mã - Đà Nẵng">Huế - Bạch Mã - Đà Nẵng</option>
                            <option value="Nha Trang - Đà Lạt">Nha Trang - Đà Lạt</option>
                            <option value="Buôn mê thuột - Gia lai - Kontum" selected>Buôn mê thuột - Gia lai - Kontum</option>
                        </optgroup>
                        <optgroup label="Miền Nam">
                            <option value="TP.HCM - Cần Thơ - Cà Mau">TP.HCM - Cần Thơ - Cà Mau</option>
                            <option value="TP.HCM - Mỹ Tho">TP.HCM - Mỹ Tho</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Phương tiện</td>
                <td>
                    <input type="radio" name="phuongtien" id="rdoMayBay" value="Máy bay"> Máy bay
                    <input type="radio" name="phuongtien" id="rdoXeOto" value="Xe ô tô" checked> Xe ô tô
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <fieldset id="grpSoLuong">
                        <legend>Số lượng đoàn khách</legend>
                        Người lớn <input type="text" id="txtNguoiLon" value="6">
                        &nbsp;&nbsp;
                        Trẻ em <input type="text" id="txtTreEm" value="4">
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td>Ghi chú thêm</td>
                <td>
                    <textarea id="txtGhiChu" rows="3">Có 2 trẻ em dưới 6 tuổi
Có 2 người ăn chay</textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="btn-cell">
                    <input type="button" id="btnDongY" value="Đồng ý" onclick="xuLyDangKy()">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div id="lblThongBao"></div>
                </td>
            </tr>
        </table>
    </form>
</div>

<script>
    function xuLyDangKy() {
        document.getElementById("lblThongBao").innerText = "Bạn đã đăng ký thành công!!!";
    }
</script>

</body>
</html>
